apply plugin: 'com.android.application'
if (enable_plugin_kotlin) {
    apply plugin: 'kotlin-android'
    apply plugin: 'kotlin-android-extensions'
    apply plugin: 'kotlin-kapt'
}

// tsunderick: bumped 18 -> 19 for androidx.webkit (WebViewAssetLoader); Android 4.4+, 2013
rootProject.ext.version_minSdk = 19

// https://github.com/vsch/flexmark-java/releases
ext.version_library_flexmark = "0.42.14"

android {
    buildToolsVersion rootProject.ext.version_buildTools
    compileSdkVersion rootProject.ext.version_compileSdk

    defaultConfig {
        resValue "string", "manifest_package_id", "net.gsantner.markor"
        applicationId "net.gsantner.markor"
        versionName "2.16.1"
        versionCode 163

        multiDexEnabled true
        minSdkVersion rootProject.ext.version_minSdk
        targetSdkVersion rootProject.ext.version_compileSdk
        buildConfigField "boolean", "IS_TEST_BUILD", "false"
        buildConfigField "boolean", "IS_GPLAY_BUILD", "false"
        buildConfigField "String[]", "DETECTED_ANDROID_LOCALES", "${findUsedAndroidLocales()}"
        buildConfigField "String", "BUILD_DATE", "\"${getBuildDate()}\""
        buildConfigField "String", "GITHASH", "\"${getGitHash}\""
        buildConfigField "String", "GITMSG", "\"${getGitLastCommitMessage}\""
        setProperty("archivesBaseName", applicationId + "-v" + versionCode + "-" + versionName)
    }

    flavorDimensions "default"
    productFlavors {
        flavorAtest {
            applicationId "net.gsantner.markor_test"
            versionCode = Integer.parseInt(new Date().format('yyMMdd'))
            versionName = defaultConfig.versionName + "-" + new Date().format('HHmm')
            buildConfigField "boolean", "IS_TEST_BUILD", "true"
        }
        flavorDefault {
        }
        flavorGplay {
            buildConfigField "boolean", "IS_GPLAY_BUILD", "true"
        }
    }

    sourceSets {
        main { assets.srcDirs = ['src/main/assets'] }
        if (enable_plugin_kotlin) {
            main.java.srcDirs += 'src/main/kotlin'
        }
        main.java.srcDirs += 'thirdparty/java'
        main.res.srcDirs += 'thirdparty/res'
        main.assets.srcDirs += 'thirdparty/assets'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE-LGPL-2.1.txt', 'META-INF/LICENSE-LGPL-3.txt', 'META-INF/LICENSE-W3C-TEST']
        }
    }


    compileOptions {
        encoding = 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'net.gsantner.markor'
    lint {
        abortOnError false
        disable 'MissingTranslation', 'InvalidPackage', 'ObsoleteLintCustomCheck', 'DefaultLocale', 'UnusedAttribute', 'VectorRaster', 'InflateParams', 'IconLocation', 'UnusedResources', 'TypographyEllipsis'
    }

}

/* tsunderick: fetch Operator Mono from the private dotfiles repo and convert to TTF.
   Flow: gh download OTF -> .font-cache (gitignored, survives gradle clean)
         -> convert CFF->TrueType outlines via scripts/otf2ttf.py (fontTools)
         -> copy TTF into app/thirdparty/assets/fonts (APK assets, font picker)
            and src/main/res/font (theme UI font via @font/operator_mono).

   Why TTF: Chromium's OTS sanitizer rejects Operator Mono's CFF table
   ("OTS parsing error: CFF : Failed to parse table") so the preview WebView
   silently falls back - TrueType outlines pass OTS. The editor is unaffected
   (Android's parser is lenient) but we ship one format everywhere.

   Skips with warnings when gh/python/fontTools are unavailable (CI): the
   bundled Source Pro Code font stands in so builds stay green. */
task downloadFonts {
    def cacheDir = rootProject.file('.font-cache')
    def assetsFontDir = file('thirdparty/assets/fonts')
    def resFontDir = file('src/main/res/font')
    def convertScript = rootProject.file('scripts/otf2ttf.py')
    def fallback = file('thirdparty/assets/fonts/Source Pro Code.ttf')
    def slotToFile = ['regular': 'Regular', 'italic': 'Italic', 'bold': 'Bold', 'bold_italic': 'Bold Italic']
    doLast {
        assetsFontDir.mkdirs()
        resFontDir.mkdirs()
        // purge stale OTFs from earlier builds (dead weight + duplicate picker entries)
        fileTree(dir: assetsFontDir, include: 'Operator*.otf').each { it.delete() }
        fileTree(dir: resFontDir, include: 'operator_mono_*.otf').each { it.delete() }

        slotToFile.each { slot, weightName ->
            def name = "Operator Mono - ${weightName}"
            def cacheOtf = new File(cacheDir, "${name}.otf")
            def cacheTtf = new File(cacheDir, "${name}.ttf")
            if (!cacheOtf.exists() || cacheOtf.length() == 0) {
                cacheDir.mkdirs()
                println ">> downloadFonts: fetching ${name}.otf"
                def proc = ['gh', 'api', "repos/tsunderick/dotfiles/contents/assets/resources/fonts/${name.replace(' ', '%20')}.otf",
                            '-H', 'Accept: application/vnd.github.raw'].execute()
                cacheOtf.withOutputStream { os -> os << proc.in }
                if (proc.waitFor() != 0 || cacheOtf.length() == 0) {
                    cacheOtf.delete()
                    println "WARNING: downloadFonts could not fetch '${name}.otf' via gh"
                }
            }
            // convert CFF -> TrueType (OTS-friendly); skipped when already converted
            if (cacheOtf.exists() && cacheOtf.length() > 0 && (!cacheTtf.exists() || cacheTtf.length() == 0)) {
                def proc = ['python3', convertScript.absolutePath, cacheOtf.absolutePath, cacheTtf.absolutePath]
                        .execute(null, rootProject.projectDir)
                proc.waitFor()
                if (cacheTtf.length() == 0) {
                    cacheTtf.delete()
                    println "WARNING: downloadFonts: conversion failed for '${name}' (python3/fontTools missing?)"
                }
            }

            def src = (cacheTtf.exists() && cacheTtf.length() > 0) ? cacheTtf : fallback
            def intoAssets = new File(assetsFontDir, "${name}.ttf")
            def intoRes = new File(resFontDir, "operator_mono_${slot}.ttf")
            intoAssets.bytes = src.bytes
            intoRes.bytes = src.bytes
            println ">> downloadFonts: ${intoAssets.name} / ${intoRes.name} <- ${src.name} (${src.length()} bytes)"
        }
    }
}
preBuild.dependsOn downloadFonts

dependencies {
    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.13.1'

    // Android standard libs
    implementation "androidx.multidex:multidex:2.0.1"
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.legacy:legacy-preference-v14:1.0.0'
    implementation 'androidx.browser:browser:1.4.0'
    // tsunderick: WebViewAssetLoader - serves bundled fonts to the preview WebView
    // over https://appassets.androidplatform.net (file:// subresources are blocked)
    implementation 'androidx.webkit:webkit:1.11.0'

    // Markdown convertor (Flexmark)
    implementation "com.vladsch.flexmark:flexmark:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-util:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-emoji:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-gfm-tasklist:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-superscript:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-autolink:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-toc:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-tables:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-jekyll-front-matter:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-jekyll-tag:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-anchorlink:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-gfm-strikethrough:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-yaml-front-matter:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-footnotes:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-gitlab:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-typographic:${version_library_flexmark}"
    implementation "com.vladsch.flexmark:flexmark-ext-admonition:${version_library_flexmark}"

    // csv support
    // https://opencsv.sourceforge.net/licenses.html License: Apache2
    // opencsv 3.10 was the last java-6 version
    // opencsv 5.7.1' for java-8 may have dependencies that are not backward compatibility with android-4.1
    //noinspection GradleDependency
    implementation('com.opencsv:opencsv:3.10') {
        // do not get transitive 'commons-beanutils:commons-beanutils as the opencsv bean <-> csv feature is not used
        exclude group: 'commons-beanutils', module: 'commons-beanutils'
    }

    // UI libs
    implementation 'com.github.Pixplicity:gene-rate:v1.1.8'
    implementation 'com.github.AppIntro:AppIntro:6.2.0'
    implementation 'com.github.mertakdut:EpubParser:1.0.95'
    implementation 'com.github.martin-stone:hsv-alpha-color-picker-android:3.1.0'

    // Tool libraries
    //noinspection AnnotationProcessorOnCompilePath
    implementation 'commons-io:commons-io:2.7'
    if (enable_plugin_kotlin) {
        implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${version_plugin_kotlin}"
    }

    // https://mvnrepository.com/artifact/com.google.code.gson/gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // Processors
    def anpros = []
    for (anpro in anpros) {
        if (enable_plugin_kotlin) {
            kapt anpro
        } else {
            annotationProcessor anpro
        }
    }
}
